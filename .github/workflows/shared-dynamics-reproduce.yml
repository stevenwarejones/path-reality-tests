name: Reproduce shared-dynamics sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'studies/shared-quantum-dynamics/**'
      - 'tests/test_shared_quantum_dynamics.py'
      - '.github/workflows/shared-dynamics-reproduce.yml'

permissions:
  contents: read

jobs:
  shared-dynamics-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r studies/shared-quantum-dynamics/requirements.txt
      - name: Download and hash-check immutable measured records
        run: python studies/shared-quantum-dynamics/sqd_sources.py --cache "$RUNNER_TEMP/shared-dynamics" --download
      - name: Reconstruct all words and check all physical predictions
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python studies/shared-quantum-dynamics/run.py --cache "$RUNNER_TEMP/shared-dynamics" --check
          python studies/shared-quantum-dynamics/certificates.py --cache "$RUNNER_TEMP/shared-dynamics" --check
          python studies/shared-quantum-dynamics/general_fit.py --cache "$RUNNER_TEMP/shared-dynamics" --check
          python studies/shared-quantum-dynamics/general_geometry.py --cache "$RUNNER_TEMP/shared-dynamics" --check
          python studies/shared-quantum-dynamics/lift_certificate.py --cache "$RUNNER_TEMP/shared-dynamics" --check
          python studies/shared-quantum-dynamics/polish_general.py --cache "$RUNNER_TEMP/shared-dynamics" --check
          python studies/shared-quantum-dynamics/sqd_repeat.py --cache "$RUNNER_TEMP/shared-dynamics" --check
          python studies/shared-quantum-dynamics/transfer_audit.py --cache "$RUNNER_TEMP/shared-dynamics" --check
          python studies/shared-quantum-dynamics/observable_audit.py --cache "$RUNNER_TEMP/shared-dynamics" --check
      - name: Reproduce runner-up source schema audits
        run: python studies/shared-quantum-dynamics/candidate_audit.py --cache "$RUNNER_TEMP/shared-dynamics-candidates" --download --check
      - name: Check independent physics and offline artifacts
        run: |
          python -m unittest discover -s tests -p 'test_shared_quantum_dynamics.py' -v
          python studies/shared-quantum-dynamics/report.py --check
          python studies/shared-quantum-dynamics/escalation_report.py --check
          python studies/shared-quantum-dynamics/general_compatibility.py --check
          git diff --exit-code
