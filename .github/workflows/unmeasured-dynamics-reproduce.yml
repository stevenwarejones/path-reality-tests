name: Reproduce unmeasured dynamics certificate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'studies/unmeasured-dynamics-gain/**'
      - 'studies/shared-quantum-dynamics/**'
      - 'studies/gst-rb-combination-gain/**'
      - 'tests/test_unmeasured_dynamics_gain.py'
      - '.github/workflows/unmeasured-dynamics-reproduce.yml'

permissions:
  contents: read

jobs:
  full-source-certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r studies/gst-rb-combination-gain/requirements.txt
      - name: Reconstruct every deposited word and certify all physical witnesses
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python studies/unmeasured-dynamics-gain/verify.py --cache "$RUNNER_TEMP/unmeasured-dynamics" --download --check
      - name: Check assumption violations and offline certificate
        run: |
          python -m unittest discover -s tests -p 'test_unmeasured_dynamics_gain.py' -v
          python studies/unmeasured-dynamics-gain/verify.py --check
          python studies/unmeasured-dynamics-gain/controls.py --check
          python studies/unmeasured-dynamics-gain/aggregate_discovery.py --cache "$RUNNER_TEMP/unmeasured-dynamics"
          git diff --exit-code
