name: Reproduce complete NIST sources

on:
  # Required by the main ruleset: every PR must publish this check.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nist-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r studies/nist-bell-causal-audit/requirements.txt -r studies/synthetic-timing-shifts/requirements.txt
      - name: Download and verify all three source inputs
        run: python studies/nist-bell-causal-audit/fetch_data.py --directory "$RUNNER_TEMP/nist-inputs"
      - name: Decode all raw records and reconcile stored settings and words
        run: |
          python studies/nist-bell-causal-audit/reconstruct.py \
            --hdf5 "$RUNNER_TEMP/nist-inputs/hdf5.hdf5" \
            --alice "$RUNNER_TEMP/nist-inputs/alice.zip" \
            --bob "$RUNNER_TEMP/nist-inputs/bob.zip" \
            --output "$RUNNER_TEMP/nist-output/reconstruction.json"
      - name: Regenerate both analyses and require source equality
        run: |
          python studies/nist-bell-causal-audit/audit.py \
            --hdf5 "$RUNNER_TEMP/nist-inputs/hdf5.hdf5" \
            --reconstruction "$RUNNER_TEMP/nist-output/reconstruction.json" \
            --output-dir "$RUNNER_TEMP/nist-output"
          python studies/nist-bell-causal-audit/click_audit.py --directory "$RUNNER_TEMP/nist-output"
          python studies/nist-bell-causal-audit/verify_reproduction.py "$RUNNER_TEMP/nist-output"
          git diff --exit-code
      - name: Reproduce empirical-background timing injections from pinned Bob records
        run: |
          python studies/synthetic-timing-shifts/empirical_extract.py \
            --hdf5 "$RUNNER_TEMP/nist-inputs/hdf5.hdf5" \
            --archive "$RUNNER_TEMP/nist-inputs/bob.zip" \
            --output "$RUNNER_TEMP/nist-output/bob-timing.npz"
          python studies/synthetic-timing-shifts/empirical.py \
            --background "$RUNNER_TEMP/nist-output/bob-timing.npz" --check
          git diff --exit-code
      - name: Reconcile both receivers and reproduce actual-setting timing bounds
        run: |
          for side in alice bob; do
            python studies/synthetic-timing-shifts/actual_extract.py \
              --hdf5 "$RUNNER_TEMP/nist-inputs/hdf5.hdf5" \
              --archive "$RUNNER_TEMP/nist-inputs/$side.zip" --side "$side" \
              --output "studies/synthetic-timing-shifts/$side-actual-counts.json" --check
          done
          python studies/synthetic-timing-shifts/actual.py --check
          git diff --exit-code
      - name: Reproduce three-way timing-structure interrogation from both raw archives
        run: |
          for side in alice bob; do
            python studies/timing-structure/extract.py \
              --hdf5 "$RUNNER_TEMP/nist-inputs/hdf5.hdf5" \
              --archive "$RUNNER_TEMP/nist-inputs/$side.zip" --side "$side" \
              --cache-dir "$RUNNER_TEMP/structure-cache" \
              --output "studies/timing-structure/$side-counts.json" --check
          done
          python studies/timing-structure/analyze.py --check
          git diff --exit-code
      - name: Re-extract fine timing and reproduce the exact coarse comparison
        run: |
          for side in alice bob; do
            python studies/fine-timing-structure/extract.py \
              --hdf5 "$RUNNER_TEMP/nist-inputs/hdf5.hdf5" \
              --archive "$RUNNER_TEMP/nist-inputs/$side.zip" --side "$side" \
              --cache-dir "$RUNNER_TEMP/fine-cache" \
              --output "studies/fine-timing-structure/$side-counts.json" --check
          done
          python studies/fine-timing-structure/analyze.py --check
          git diff --exit-code
