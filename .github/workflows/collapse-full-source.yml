name: Reproduce collapse public sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collapse-full-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis dependencies
        run: python -m pip install -r studies/collapse-compatibility/requirements.txt
      - name: Acquire and verify external original bytes
        run: python studies/collapse-compatibility/fetch_data.py --data-dir "$RUNNER_TEMP/collapse-sources"
      - name: Reproduce source fits, oracle, combinations and artifacts
        run: python studies/collapse-compatibility/analyze.py --data-dir "$RUNNER_TEMP/collapse-sources" --check
      - name: Verify tracked inputs remain unchanged
        run: git diff --exit-code
