name: Calibrated memory audit

on:
  pull_request:
    paths:
      - 'studies/calibrated-quantum-memory/**'
      - 'tests/test_calibrated_quantum_memory.py'
      - '.github/workflows/calibrated-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r studies/calibrated-quantum-memory/requirements.txt
      - name: Check physical witnesses and acquisition failure modes
        run: python -m unittest discover -s tests -p 'test_calibrated_quantum_memory.py' -v
      - name: Reproduce synthetic certificate and power
        run: python studies/calibrated-quantum-memory/certificate.py --check
      - name: Retrieve and verify pinned NMN counts
        run: python studies/calibrated-quantum-memory/audit.py --source-dir "$RUNNER_TEMP/nmn" --download --check
      - name: Confirm tracked files remain unchanged
        run: git diff --exit-code
