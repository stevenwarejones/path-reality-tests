name: Verify data and calculations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: studies/wen-2026-propagator/requirements.txt
      - name: Install pinned study dependencies
        run: python -m pip install -r studies/wen-2026-propagator/requirements.txt
      - name: Check tracked files and documentation links
        run: python scripts/check_repository.py
      - name: Test integrity failures, extraction and numerical counterexamples
        run: python -m unittest discover -s tests -v
      - name: Verify all 19 originals without network access
        run: python studies/wen-2026-propagator/fetch_data.py --verify-only
      - name: Inventory every workbook outside the repository
        run: python studies/wen-2026-propagator/extract_workbooks.py --output "$RUNNER_TEMP/workbooks"
      - name: Check synthetic outputs and regenerate review artifacts
        run: python studies/wen-2026-propagator/synthetic_checks.py --check --output-dir "$RUNNER_TEMP/review-artifacts"
      - name: Confirm inputs and tracked outputs remain unchanged
        run: |
          python studies/wen-2026-propagator/fetch_data.py --verify-only
          git diff --exit-code
      - name: Attach synthetic figures and numerical results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-review-${{ github.sha }}
          path: ${{ runner.temp }}/review-artifacts/
          retention-days: 14
          if-no-files-found: error
