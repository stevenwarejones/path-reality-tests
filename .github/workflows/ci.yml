name: Verify data and calculations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            studies/wen-2026-propagator/requirements.txt
            studies/phase-intervention-design/requirements.txt
            studies/path-contextuality/requirements.txt
            studies/path-compatibility/requirements.txt
            studies/spacetime-causal-influence/requirements.txt
            studies/nist-bell-causal-audit/requirements.txt
            studies/synthetic-timing-shifts/requirements.txt
      - name: Install pinned study dependencies
        run: python -m pip install -r studies/wen-2026-propagator/requirements.txt -r studies/phase-intervention-design/requirements.txt -r studies/path-contextuality/requirements.txt -r studies/path-compatibility/requirements.txt -r studies/spacetime-causal-influence/requirements.txt -r studies/nist-bell-causal-audit/requirements.txt -r studies/synthetic-timing-shifts/requirements.txt
      - name: Check tracked files and documentation links
        run: python scripts/check_repository.py
      - name: Test integrity failures, extraction and numerical counterexamples
        run: python -m unittest discover -s tests -v
      - name: Verify all 19 originals without network access
        run: python studies/wen-2026-propagator/fetch_data.py --verify-only
      - name: Inventory every workbook outside the repository
        run: python studies/wen-2026-propagator/extract_workbooks.py --output "$RUNNER_TEMP/workbooks"
      - name: Check synthetic outputs and regenerate review artifacts
        run: python studies/wen-2026-propagator/synthetic_checks.py --check --output-dir "$RUNNER_TEMP/review-artifacts"
      - name: Reproduce deposited figures and verify reviewed residuals
        run: python studies/wen-2026-propagator/replicate.py --check --output-dir "$RUNNER_TEMP/review-artifacts/replication"
      - name: Check phase-intervention design and exact identifiability witnesses
        run: |
          python studies/phase-intervention-design/intervention_checks.py --check
          python studies/phase-intervention-design/design.py --check
          python studies/wen-2026-propagator/identifiability_checks.py --check
      - name: Check finite path-contextuality instrument and prospective power
        run: python studies/path-contextuality/design.py --check
      - name: Check spacetime causal-influence sensitivity snapshot
        run: python studies/spacetime-causal-influence/design.py --check
      - name: Check sharp compatibility boundary
        run: |
          python studies/path-compatibility/analyze.py --check
          python studies/path-compatibility/plot.py --output-dir "$RUNNER_TEMP/review-artifacts/path-compatibility"
      - name: Reproduce synthetic timing-shift sensitivity and null controls
        run: python studies/synthetic-timing-shifts/design.py --check
      - name: Reproduce conditional actual-setting timing bounds
        run: python studies/synthetic-timing-shifts/actual.py --check
      - name: Check NIST causal-audit counts, assumptions and report
        run: |
          python studies/nist-bell-causal-audit/audit.py --check
          python studies/nist-bell-causal-audit/click_audit.py --check
          python studies/nist-bell-causal-audit/report.py --output-dir "$RUNNER_TEMP/nist-report"
          cmp studies/nist-bell-causal-audit/results/report.md "$RUNNER_TEMP/nist-report/report.md"
          cmp studies/nist-bell-causal-audit/results/diagnostics.svg "$RUNNER_TEMP/nist-report/diagnostics.svg"
      - name: Confirm inputs and tracked outputs remain unchanged
        run: |
          python studies/wen-2026-propagator/fetch_data.py --verify-only
          git diff --exit-code
      - name: Attach regenerated figures and numerical results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-review-${{ github.sha }}
          path: ${{ runner.temp }}/review-artifacts/
          retention-days: 14
          if-no-files-found: error
