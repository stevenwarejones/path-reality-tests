name: Reproduce detector-normalized dynamics checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'studies/detector-normalized-dynamics/**'
      - 'studies/unmeasured-dynamics-gain/**'
      - 'studies/gst-rb-combination-gain/**'
      - 'studies/shared-quantum-dynamics/**'
      - 'tests/test_detector_normalized_dynamics.py'
      - '.github/workflows/detector-normalized-reproduce.yml'

permissions:
  contents: read

jobs:
  full-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r studies/gst-rb-combination-gain/requirements.txt
      - name: Reconstruct measured counts and verify physical probability binding
        run: |
          python studies/shared-quantum-dynamics/sqd_sources.py --cache "$RUNNER_TEMP/dynamics-counts" --download
          python studies/detector-normalized-dynamics/adequacy.py --cache "$RUNNER_TEMP/dynamics-counts" --check
          python studies/detector-normalized-dynamics/stability.py --source-cache "$RUNNER_TEMP/dynamics-counts" --audit-cache "$RUNNER_TEMP/dynamics-stability" --download --check
      - name: Check normalization and assumption failures
        run: |
          python studies/detector-normalized-dynamics/normalized.py --check
          python -m unittest discover -s tests -p 'test_detector_normalized_dynamics.py' -v
          git diff --exit-code
