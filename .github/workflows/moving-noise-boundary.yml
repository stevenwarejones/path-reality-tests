name: Verify moving-noise feasibility boundary

on:
  pull_request:
    paths:
      - 'studies/moving-noise-boundary/**'
      - 'studies/collapse-compatibility/**'
      - 'tests/test_moving_noise_boundary.py'
      - '.github/workflows/moving-noise-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studies/moving-noise-boundary/requirements.txt
      - run: |
          python -m unittest discover -s tests -p test_moving_noise_boundary.py -v
          python studies/moving-noise-boundary/analyze.py --check
          python studies/moving-noise-boundary/plot.py --check
          python studies/moving-noise-boundary/cal_audit.py --check
          python studies/collapse-compatibility/moving_analysis.py --check
          git diff --exit-code
  full-source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studies/moving-noise-boundary/requirements.txt
      - name: Download and verify original external sources
        run: python studies/collapse-compatibility/fetch_data.py --data-dir "$RUNNER_TEMP/noise-sources"
      - name: Reproduce calibrated source summaries and feasibility boundary
        run: |
          python studies/moving-noise-boundary/analyze.py --data-dir "$RUNNER_TEMP/noise-sources" --check
          OPENBLAS_NUM_THREADS=1 python studies/moving-noise-boundary/cal_audit.py --data-dir "$RUNNER_TEMP/cal-sources" --fetch --check
          git diff --exit-code
