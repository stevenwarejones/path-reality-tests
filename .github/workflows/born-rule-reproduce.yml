name: Reproduce Born-rule source audits

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  born-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r studies/born-rule-identifiability/requirements.txt
      - name: Fetch and verify external originals
        run: python studies/born-rule-identifiability/fetch_data.py --cache "$RUNNER_TEMP/born-sources" --portfolio
      - name: Reproduce all source audits and derived findings
        run: |
          python studies/born-rule-identifiability/analyze.py --cache "$RUNNER_TEMP/born-sources" --check
          python studies/born-rule-identifiability/combinations.py --cache "$RUNNER_TEMP/born-sources" --check
          git diff --exit-code
